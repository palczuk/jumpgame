<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JUMP</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1 id="game-title">JUMP</h1>
  <div id="language-switch">
    <label for="language" id="language-label">🌐 LANGUAGE / IDIOMA</label>
    <select id="language"><option value="en" selected>English</option><option value="pt">Portugu&#234;s</option></select>
  </div>
  <button id="fullscreen" type="button">Fullscreen</button>
</header>
<main id="game-shell">
  <canvas id="g" width="1280" height="768" tabindex="0" aria-label="JUMP game"></canvas>
  <div id="touch-controls" aria-label="Touch controls">
    <div class="move-controls">
      <button type="button" data-key="ArrowLeft" data-label="left" aria-label="Move left">◀</button>
      <button type="button" data-key="ArrowRight" data-label="right" aria-label="Move right">▶</button>
    </div>
    <div class="action-controls">
      <button type="button" data-action="jump" data-label="jumpButton">Jump</button>
      <button type="button" data-key="KeyX" data-label="attackButton">Attack</button>
    </div>
  </div>
</main>
<p class="instructions" id="instructions"></p>
<p class="credits" id="credits">Desenvolvido por Palczuk J.</p>
<!-- Primeiro carregue os mapas individuais; depois registre-os na lista de fases. -->
<script defer src="js/levels/jungle-1.js"></script>
<script defer src="js/levels/jungle-3.js"></script>
<script defer src="js/levels.js"></script>
<script defer src="js/characters.js"></script>
<script defer src="js/audio.js"></script>
<script defer src="js/i18n.js"></script>
<script defer src="js/character-select.js"></script>
<!-- O motor carrega em ordem: estado, atualizacao, desenhos, controles e inicializacao. -->
<script defer src="js/game.js"></script>
<script defer src="js/game-update.js"></script>
<script defer src="js/game-weapons.js"></script>
<script defer src="js/game-characters.js"></script>
<script defer src="js/game-render.js"></script>
<script defer src="js/game-controls.js"></script>
<script defer src="js/main.js"></script>
<script data-goatcounter="https://palczuk.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
